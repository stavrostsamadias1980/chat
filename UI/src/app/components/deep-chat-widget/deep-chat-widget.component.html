<!-- 1. Floating Launcher Button (Fixed Bottom-Right - Disappears when chat is open) -->
<button 
  class="deepchat-widget-launcher d-flex align-items-center justify-content-center position-fixed" 
  [class.active]="isOpen()"
  (click)="toggleWidget()"
  aria-label="Άνοιγμα Anytime AI Chatbot"
  title="Άνοιγμα Anytime AI Assistant"
>
  <span class="launcher-pulse position-absolute"></span>
  <!-- Chat Speech Bubble Icon -->
  <svg class="launcher-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
  </svg>
</button>

<!-- 2. Floating Chat Widget Modal (Fixed Bottom-Right) -->
<div 
  class="deepchat-widget-container position-fixed" 
  [class.open]="isOpen()" 
  role="dialog" 
  aria-labelledby="deepchat-title"
>
  <!-- Widget Header with Close 'X' Button -->
  <header class="deepchat-header d-flex align-items-center justify-content-between w-100">
    <div class="header-main-group d-flex align-items-center gap-2">
      <div class="deepchat-avatar d-flex align-items-center justify-content-center text-white fw-bold">
        <span>A</span>
      </div>
      <div class="deepchat-header-text d-flex flex-column">
        <div class="d-flex align-items-center gap-2">
          <h3 id="deepchat-title" class="m-0 text-white fw-bold">Anytime AI Assistant</h3>
          <span class="badge-brand badge">Deep Chat</span>
        </div>
        <div class="header-status-line d-flex align-items-center gap-1">
          <span class="status-dot" [class.online]="chatService.isConnected()"></span>
          <span class="status-label">{{ chatService.connectionStatusText() }}</span>
          <span class="badge-speech badge">🎙️ Voice Ready</span>
        </div>
      </div>
    </div>
    <div class="header-actions d-flex align-items-center">
      <!-- Clicking this close button closes chat & restores launcher button -->
      <button 
        class="header-action-btn close-btn d-flex align-items-center justify-content-center" 
        (click)="toggleWidget()" 
        title="Κλείσιμο" 
        aria-label="Κλείσιμο"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Widget Body: Deep Chat Component -->
  <div class="deepchat-body">
    <deep-chat
      [connect]="connectConfig"
      [chatStyle]="chatStyle"
      [messageStyles]="messageStyles"
      [textInput]="textInput"
      [speechToText]="speechToText"
      [introMessage]="introMessage"
      [avatars]="avatars"
      [submitButtonStyles]="submitButtonStyles"
    ></deep-chat>
  </div>
</div>
